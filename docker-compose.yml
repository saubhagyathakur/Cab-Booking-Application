version: '3.8'

services:
  postgres:
    image: postgres:16-alpine
    container_name: cab-booking-postgres
    restart: always
    environment:
      POSTGRES_DB: cabbooking
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgrespassword
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d cabbooking"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - cab-network

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: cab-booking-backend
    restart: always
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      SPRING_PROFILES_ACTIVE: prod
      DB_HOST: postgres
      DB_PORT: 5432
      DB_NAME: cabbooking
      DB_USER: postgres
      DB_PASSWORD: postgrespassword
      JWT_SECRET: 404E635266556A586E3272357538782F413F4428472B4B6250645367566B5970
      STRIPE_SECRET_KEY: ${STRIPE_SECRET_KEY:-sk_test_placeholder_key_for_development}
      STRIPE_PUBLISHABLE_KEY: ${STRIPE_PUBLISHABLE_KEY:-pk_test_placeholder_key_for_development}
      CORS_ALLOWED_ORIGINS: http://localhost,http://localhost:80,http://localhost:5173
    ports:
      - "8080:8080"
    networks:
      - cab-network

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: cab-booking-frontend
    restart: always
    depends_on:
      - backend
    ports:
      - "80:80"
      - "5173:80"
    networks:
      - cab-network

volumes:
  pgdata:

networks:
  cab-network:
    driver: bridge
